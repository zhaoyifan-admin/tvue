<!DOCTYPE html>

<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="../../cdn/axios/axios.js"></script>

    <script src="../../cdn/vue/vue.global.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/element-plus/icons-vue.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/tvue.js"></script>
    <style>
      .demo {
        background: #00a680;
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      {{page}}
      <div class="demo">
        <tvue-crud
          ref="crud"
          :option="option"
          @size-change="sizeChange"
          @current-change="currentChange"
          :data="data"
          v-model:page="page"
          @on-load="onLoad"
          @error="error"
        ></tvue-crud>
      </div>

    </div>
  </body>
  <script>
    var app = Vue.createApp({
      data() {
        return {
          page: {
            pageSize: 20,
            pageSizes: [20, 100, 150, 200],
            total: 0,
          },
          data: [],
          option: {
            excelBtn: true,
            border: true,
            index: true,
            expandLevel: 3,
            headerAlign: 'center',
            align: 'center',
            tree: true,
            labelWidth: 100,
            height: 'auto',
            card: true,
            column: [{
              width: 130,
              label: '姓名',
              prop: 'name',
              display: false
            }, {
              label: '性别1',
              prop: 'sex',
              display: false
            },
              {
                label: '自定义图标',
                prop: 'icon',
                type: "icon",
                iconList: [{
                  label: '基本图表',
                  list: ['el-icon-time', 'el-icon-bell', 'el-icon-star-on']
                }],
                display: false
              }, {
                label: '多级表头',
                display: false,
                children: [{
                  label: '信息',
                  display: false,
                  children: [{
                    label: '年龄',
                    prop: 'age',
                    display: false
                  }, {
                    label: '手机号',
                    prop: 'phone',
                    display: false
                  }]
                }, {
                  label: '级别',
                  prop: 'grade',
                  type: 'select',
                  display: false,
                  dicData: [{
                    label: '测试',
                    value: 1
                  }]
                }]
              }, {
                label: '测试',
                prop: 'test',
                display: false
              }],
            group: [{
              label: '用户信息',
              prop: 'jbxx',
              icon: 'el-icon-edit-outline',
              column: [
                {
                  label: '姓名',
                  prop: 'name'
                },
                {
                  label: '年龄',
                  prop: 'age'
                }
              ]
            }, {
              label: '其他信息',
              prop: 'jbxxs',
              icon: 'el-icon-edit-outline',
              column: [
                {
                  label: '级别',
                  prop: 'grade',
                  type: 'select',
                  dicData: [{
                    label: '测试',
                    value: 1
                  }]
                },
                {
                  label: '手机信息',
                  prop: 'phone'
                },
                {
                  label: '自定义图标',
                  prop: 'icon',
                  type: "icon",
                  iconList: [{
                    label: '基本图表',
                    list: ['el-icon-time', 'el-icon-bell', 'el-icon-star-on']
                  }]
                },
              ]
            }]
          }
        };
      },
      methods: {
        error(val) {
          this.$message.error(val[0].message);
        },
        sizeChange(val) {
          this.$message.success("行数" + val);
        },
        currentChange(val) {
          this.$message.success("页码" + val);
        },
        onLoad() {
          setTimeout(() => {
            this.page.total = 40;
            //模拟分页
            if (this.page.currentPage === 1) {
              this.data = [{
                id: '1',
                name: '张三',
                age: 14,
                grade: 1,
                phone1: '17547400801',
                phone: '17547400802',
                icon: 'el-icon-time',
                test: 1,
                sex: '男',
                children: [{
                  id: '2',
                  name: '李四',
                  age: 20,
                  grade: 1,
                  sex: '男',
                  test: 1,
                  phone1: '17547400803',
                  phone: '17547400804',
                  icon: 'el-icon-bell',
                  children: [{
                    id: '3',
                    name: '王五',
                    age: 10,
                    grade: 1,
                    test: 1,
                    sex: '女',
                    icon: 'el-icon-star-on',
                    phone1: '17547400805',
                    phone: '17547400806'
                  }]
                }]
              }, {
                id: '4',
                name: '王五',
                age: 10,
                grade: 1,
                test: 1,
                sex: '女',
                icon: 'el-icon-star-on',
                phone1: '17547400807',
                phone: '17547400808'
              }];
            } else if (this.page.currentPage == 2) {
              this.data = [
                {
                  name: "李四",
                  sex: "女",
                },
              ];
            }
          }, 0);
        },
      },
    });
    app.use(ElementPlus);
    app.use(TVUE);
    app.mount("#app");
  </script>
</html>
